<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentBuddy</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 text-gray-900">

<!-- LOGIN OVERLAY -->
<div id="authOverlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold mb-2">Welcome to RentBuddy</h2>
    <p class="text-gray-500 mb-4">Login to post properties</p>
    <button id="overlayLoginBtn" class="w-full bg-pink-500 text-white py-3 rounded-xl">
      Login with Google
    </button>
  </div>
</div>

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-6 py-4 bg-pink-100/80 backdrop-blur shadow-sm sticky top-0">
  <h1 class="text-2xl font-bold">RentBuddy</h1>

  <button id="loginBtn" class="px-4 py-2 border rounded-xl hover:bg-pink-200">
    Login
  </button>
</nav>

<!-- FORM -->
<section class="max-w-3xl mx-auto px-6 py-10">

  <h2 class="text-3xl font-bold mb-6">Post a Property</h2>

  <!-- IMAGES -->
  <label class="font-semibold">Images</label>
  <input id="images" type="file" multiple accept="image/*" class="block mb-3" />
  <div id="preview" class="flex gap-2 flex-wrap mb-5"></div>

  <!-- TITLE -->
  <input id="title" placeholder="Title"
    class="w-full border p-3 rounded-xl mb-4"/>

  <!-- DETAILS -->
  <textarea id="details" placeholder="Details"
    class="w-full border p-3 rounded-xl mb-4"></textarea>

  <!-- PRICE -->
  <input id="price" placeholder="Price"
    class="w-full border p-3 rounded-xl mb-4"/>

  <!-- PHONE -->
  <input id="phone" placeholder="Contact Phone"
    class="w-full border p-3 rounded-xl mb-4"/>

  <!-- LOCATION -->
  <input id="location" placeholder="Location"
    class="w-full border p-3 rounded-xl mb-4"/>

  <button id="submitBtn"
    class="w-full bg-pink-500 text-white py-3 rounded-xl hover:bg-pink-600">
    Submit Property
  </button>

</section>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIoxwUza-JTJUmGRe80_hCID-AIfHlkUw",
  authDomain: "rentbuddyonline.firebaseapp.com",
  projectId: "rentbuddyonline",
  storageBucket: "rentbuddyonline.firebasestorage.app",
  messagingSenderId: "1023186235567",
  appId: "1:1023186235567:web:d6c1dbb6947f46c0a4e45a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let user = null;

/* LOGIN */
const loginBtn = document.getElementById("loginBtn");
const overlayLoginBtn = document.getElementById("overlayLoginBtn");
const overlay = document.getElementById("authOverlay");

function login() {
  signInWithPopup(auth, provider).catch(() => {
    alert("Login failed");
  });
}

loginBtn.onclick = login;
overlayLoginBtn.onclick = login;

onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    loginBtn.innerText = user.displayName;
    overlay.classList.add("hidden");
  } else {
    loginBtn.innerText = "Login";
    overlay.classList.remove("hidden");
  }
});

/* IMAGE PREVIEW */
const imagesInput = document.getElementById("images");
const preview = document.getElementById("preview");

let imageData = [];

imagesInput.addEventListener("change", (e) => {
  preview.innerHTML = "";
  imageData = [];

  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();

    reader.onload = () => {
      imageData.push(reader.result);

      const img = document.createElement("img");
      img.src = reader.result;
      img.className = "w-20 h-20 object-cover rounded-lg";
      preview.appendChild(img);
    };

    reader.readAsDataURL(file);
  });
});

/* SUBMIT */
document.getElementById("submitBtn").onclick = () => {

  if (!user) {
    alert("Please login first");
    return;
  }

  const post = {
    title: document.getElementById("title").value,
    details: document.getElementById("details").value,
    price: document.getElementById("price").value,
    phone: document.getElementById("phone").value,
    location: document.getElementById("location").value,
    images: imageData,
    date: new Date().toISOString(),
    user: user.displayName
  };

  console.log("POST:", post);
  alert("Property submitted (check console)");
};

</script>

</body>
</html>
