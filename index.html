<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentBuddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 text-gray-900">

<!-- LOGIN OVERLAY -->
<div id="authOverlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold mb-2">Welcome to RentBuddy</h2>
    <p class="text-gray-500 mb-4">Login to continue</p>
    <button id="overlayLoginBtn" class="w-full bg-pink-500 text-white py-3 rounded-xl">
      Login with Google
    </button>
  </div>
</div>

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-6 py-4 bg-pink-100/80 backdrop-blur shadow-sm sticky top-0 z-10">
  <h1 class="text-2xl font-bold">RentBuddy</h1>

  <div class="flex gap-3">
    <button id="loginBtn" class="px-4 py-2 border rounded-xl hover:bg-pink-200">
      Login
    </button>

    <button id="postBtn" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600">
      Post Property
    </button>
  </div>
</nav>

<!-- ================= HOME PAGE ================= -->
<section id="homePage">

  <!-- HERO -->
  <div class="text-center px-6 py-14">
    <h2 class="text-5xl font-bold mb-4">Find Your Perfect Home</h2>
    <p class="text-gray-600 max-w-2xl mx-auto">
      Browse rental homes in Bangladesh easily.
    </p>
  </div>

  <!-- LISTINGS -->
  <div class="px-6 grid grid-cols-1 md:grid-cols-3 gap-6 pb-16">

    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <img class="h-52 w-full object-cover" src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200"/>
      <div class="p-4">
        <h3 class="font-bold">Modern Apartment</h3>
        <p class="text-gray-500">Mymensingh</p>
        <p class="font-bold mt-2">৳15,000</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <img class="h-52 w-full object-cover" src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200"/>
      <div class="p-4">
        <h3 class="font-bold">Family House</h3>
        <p class="text-gray-500">Dhaka</p>
        <p class="font-bold mt-2">৳25,000</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <img class="h-52 w-full object-cover" src="https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200"/>
      <div class="p-4">
        <h3 class="font-bold">Student Room</h3>
        <p class="text-gray-500">Mymensingh</p>
        <p class="font-bold mt-2">৳6,000</p>
      </div>
    </div>

  </div>
</section>

<!-- ================= POST PAGE ================= -->
<section id="postPage" class="hidden max-w-3xl mx-auto px-6 py-10">

  <button onclick="goHome()" class="mb-6 px-4 py-2 border rounded-xl">
    ← Back
  </button>

  <h2 class="text-3xl font-bold mb-6">Post a Property</h2>

  <label class="font-semibold">Images</label>
  <input id="images" type="file" multiple accept="image/*" class="block mb-3"/>
  <div id="preview" class="flex gap-2 flex-wrap mb-5"></div>

  <input id="title" placeholder="Title" class="w-full border p-3 rounded-xl mb-4"/>
  <textarea id="details" placeholder="Details" class="w-full border p-3 rounded-xl mb-4"></textarea>
  <input id="price" placeholder="Price" class="w-full border p-3 rounded-xl mb-4"/>
  <input id="phone" placeholder="Phone Number" class="w-full border p-3 rounded-xl mb-4"/>
  <input id="location" placeholder="Location" class="w-full border p-3 rounded-xl mb-4"/>

  <button id="submitBtn" class="w-full bg-pink-500 text-white py-3 rounded-xl">
    Submit Property
  </button>

</section>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIoxwUza-JTJUmGRe80_hCID-AIfHlkUw",
  authDomain: "rentbuddyonline.firebaseapp.com",
  projectId: "rentbuddyonline",
  storageBucket: "rentbuddyonline.firebasestorage.app",
  messagingSenderId: "1023186235567",
  appId: "1:1023186235567:web:d6c1dbb6947f46c0a4e45a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let user = null;

/* LOGIN */
const loginBtn = document.getElementById("loginBtn");
const overlayLoginBtn = document.getElementById("overlayLoginBtn");
const overlay = document.getElementById("authOverlay");

function login() {
  signInWithPopup(auth, provider).catch(() => alert("Login failed"));
}

loginBtn.onclick = login;
overlayLoginBtn.onclick = login;

onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    loginBtn.innerText = user.displayName;
    overlay.classList.add("hidden");
  } else {
    loginBtn.innerText = "Login";
    overlay.classList.remove("hidden");
  }
});

/* PAGE SWITCH */
const homePage = document.getElementById("homePage");
const postPage = document.getElementById("postPage");

document.getElementById("postBtn").onclick = () => {
  homePage.classList.add("hidden");
  postPage.classList.remove("hidden");
};

function goHome() {
  postPage.classList.add("hidden");
  homePage.classList.remove("hidden");
}
window.goHome = goHome;

/* IMAGE PREVIEW */
const imagesInput = document.getElementById("images");
const preview = document.getElementById("preview");

let imageData = [];

imagesInput.addEventListener("change", (e) => {
  preview.innerHTML = "";
  imageData = [];

  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      imageData.push(reader.result);

      const img = document.createElement("img");
      img.src = reader.result;
      img.className = "w-20 h-20 object-cover rounded-lg";
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

/* SUBMIT */
document.getElementById("submitBtn").onclick = () => {

  if (!user) return alert("Please login first");

  const post = {
    title: title.value,
    details: details.value,
    price: price.value,
    phone: phone.value,
    location: location.value,
    images: imageData,
    date: new Date().toISOString(),
    user: user.displayName
  };

  console.log("POST:", post);
  alert("Property created (check console)");
};

</script>

</body>
</html>
