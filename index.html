<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentBuddy</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 text-gray-900">

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-6 py-4 bg-pink-100/80 backdrop-blur shadow-sm sticky top-0 z-10">
  <div>
    <h1 class="text-2xl font-bold">RentBuddy</h1>
    <p class="text-sm text-gray-600">Find Your Perfect Home</p>
  </div>

  <div class="flex gap-3 items-center">
    <button id="loginBtn" class="px-4 py-2 rounded-2xl border hover:bg-pink-200 transition">
      Login with Google
    </button>

    <button id="postBtn" class="px-4 py-2 rounded-2xl bg-pink-500 text-white hover:bg-pink-600 transition">
      Post Property
    </button>
  </div>
</nav>

<!-- HERO -->
<section class="text-center px-6 py-16">
  <h2 class="text-5xl font-bold mb-4">Discover Rental Homes Easily</h2>
  <p class="text-gray-600 mb-8 max-w-2xl mx-auto">
    Browse apartments, houses, and rooms in Bangladesh.
  </p>

  <input class="w-full max-w-xl px-5 py-4 border rounded-2xl" placeholder="Search location..." />
</section>

<!-- LISTINGS -->
<section class="px-6 pb-16 grid grid-cols-1 md:grid-cols-3 gap-6">

  <div class="bg-white rounded-3xl shadow-md overflow-hidden">
    <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200&auto=format&fit=crop" class="h-60 w-full object-cover"/>
    <div class="p-5">
      <h3 class="text-xl font-bold">Modern Apartment</h3>
      <p class="text-gray-500">Mymensingh</p>
      <p class="font-bold mt-2">৳15,000/month</p>
    </div>
  </div>

  <div class="bg-white rounded-3xl shadow-md overflow-hidden">
    <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200&auto=format&fit=crop" class="h-60 w-full object-cover"/>
    <div class="p-5">
      <h3 class="text-xl font-bold">Family House</h3>
      <p class="text-gray-500">Dhaka</p>
      <p class="font-bold mt-2">৳25,000/month</p>
    </div>
  </div>

  <div class="bg-white rounded-3xl shadow-md overflow-hidden">
    <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?q=80&w=1200&auto=format&fit=crop" class="h-60 w-full object-cover"/>
    <div class="p-5">
      <h3 class="text-xl font-bold">Student Room</h3>
      <p class="text-gray-500">Mymensingh</p>
      <p class="font-bold mt-2">৳6,000/month</p>
    </div>
  </div>

</section>

<!-- POST PROPERTY MODAL -->
<div id="postModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center">

  <div class="bg-white p-6 rounded-2xl w-full max-w-lg">

    <h2 class="text-2xl font-bold mb-4">Post a Property</h2>

    <input class="w-full border p-2 mb-3 rounded" placeholder="Title"/>
    <input class="w-full border p-2 mb-3 rounded" placeholder="Price"/>
    <input class="w-full border p-2 mb-3 rounded" placeholder="Location"/>
    <textarea class="w-full border p-2 mb-3 rounded" placeholder="Description"></textarea>

    <div class="flex justify-end gap-2">
      <button id="closeModal" class="px-4 py-2 border rounded">Cancel</button>
      <button class="px-4 py-2 bg-pink-500 text-white rounded">Submit</button>
    </div>

  </div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIoxwUza-JTJUmGRe80_hCID-AIfHlkUw",
  authDomain: "rentbuddyonline.firebaseapp.com",
  projectId: "rentbuddyonline",
  storageBucket: "rentbuddyonline.firebasestorage.app",
  messagingSenderId: "1023186235567",
  appId: "1:1023186235567:web:d6c1dbb6947f46c0a4e45a",
  measurementId: "G-KTGB5W7XSB"
};

const app = initializeApp(firebaseConfig);
getAnalytics(app);

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* LOGIN */
const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    loginBtn.innerText = result.user.displayName;
  } catch (err) {
    console.error(err);
    alert("Login failed");
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) loginBtn.innerText = user.displayName;
});

/* POST MODAL */
const postBtn = document.getElementById("postBtn");
const postModal = document.getElementById("postModal");
const closeModal = document.getElementById("closeModal");

postBtn.addEventListener("click", () => {
  postModal.classList.remove("hidden");
});

closeModal.addEventListener("click", () => {
  postModal.classList.add("hidden");
});

</script>

</body>
</html>
