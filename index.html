<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentBuddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 text-gray-900">

<!-- LOGIN OVERLAY -->
<div id="authOverlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold mb-2">RentBuddy Login</h2>
    <p class="text-gray-500 mb-4">Login to post and view properties</p>
    <button id="overlayLoginBtn" class="w-full bg-pink-500 text-white py-3 rounded-xl">
      Login with Google
    </button>
  </div>
</div>

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-6 py-4 bg-pink-100/80 backdrop-blur shadow-sm sticky top-0 z-10">
  <h1 class="text-2xl font-bold">RentBuddy</h1>

  <div class="flex gap-3">
    <button id="loginBtn" class="px-4 py-2 border rounded-xl hover:bg-pink-200">
      Login
    </button>

    <button id="postBtn" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600">
      Post Property
    </button>
  </div>
</nav>

<!-- ================= HOME ================= -->
<section id="homePage" class="px-6 py-10">

  <h2 class="text-3xl font-bold mb-6">Latest Rentals</h2>

  <div id="listings" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

</section>

<!-- ================= POST PAGE ================= -->
<section id="postPage" class="hidden max-w-3xl mx-auto px-6 py-10">

  <button onclick="goHome()" class="mb-6 px-4 py-2 border rounded-xl">
    ← Back
  </button>

  <h2 class="text-3xl font-bold mb-6">Post a Property</h2>

  <input id="title" placeholder="Title" class="w-full border p-3 rounded-xl mb-4"/>
  <textarea id="details" placeholder="Details" class="w-full border p-3 rounded-xl mb-4"></textarea>
  <input id="price" placeholder="Price" class="w-full border p-3 rounded-xl mb-4"/>
  <input id="phone" placeholder="Phone Number" class="w-full border p-3 rounded-xl mb-4"/>
  <input id="location" placeholder="Location" class="w-full border p-3 rounded-xl mb-4"/>

  <input id="images" type="file" multiple accept="image/*" class="mb-4"/>

  <button id="submitBtn" class="w-full bg-pink-500 text-white py-3 rounded-xl">
    Submit Property
  </button>

</section>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIoxwUza-JTJUmGRe80_hCID-AIfHlkUw",
  authDomain: "rentbuddyonline.firebaseapp.com",
  projectId: "rentbuddyonline",
  storageBucket: "rentbuddyonline.firebasestorage.app",
  messagingSenderId: "1023186235567",
  appId: "1:1023186235567:web:d6c1dbb6947f46c0a4e45a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let user = null;

/* LOGIN */
const loginBtn = document.getElementById("loginBtn");
const overlay = document.getElementById("authOverlay");

function login() {
  signInWithPopup(auth, provider).catch(() => alert("Login failed"));
}

loginBtn.onclick = login;
document.getElementById("overlayLoginBtn").onclick = login;

onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    loginBtn.innerText = user.displayName;
    overlay.classList.add("hidden");
    loadProperties();
  } else {
    loginBtn.innerText = "Login";
    overlay.classList.remove("hidden");
  }
});

/* PAGE SWITCH */
const homePage = document.getElementById("homePage");
const postPage = document.getElementById("postPage");

document.getElementById("postBtn").onclick = () => {
  if (!user) return alert("Login first!");
  homePage.classList.add("hidden");
  postPage.classList.remove("hidden");
};

function goHome() {
  postPage.classList.add("hidden");
  homePage.classList.remove("hidden");
}
window.goHome = goHome;

/* UPLOAD + SUBMIT */
document.getElementById("submitBtn").onclick = async () => {

  if (!user) return alert("Login required");

  const files = document.getElementById("images").files;
  let imageUrls = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const storageRef = ref(storage, `properties/${Date.now()}-${file.name}`);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);
    imageUrls.push(url);
  }

  await addDoc(collection(db, "properties"), {
    title: title.value,
    details: details.value,
    price: price.value,
    phone: phone.value,
    location: location.value,
    images: imageUrls,
    date: new Date().toISOString(),
    user: user.displayName,
    uid: user.uid
  });

  alert("Property posted successfully!");
  goHome();
  loadProperties();
};

/* LOAD PROPERTIES */
async function loadProperties() {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  const snapshot = await getDocs(collection(db, "properties"));

  snapshot.forEach(doc => {
    const data = doc.data();

    container.innerHTML += `
      <div class="bg-white rounded-2xl shadow overflow-hidden">
        <img src="${data.images?.[0] || ''}" class="h-52 w-full object-cover"/>
        <div class="p-4">
          <h3 class="font-bold">${data.title}</h3>
          <p class="text-gray-500">${data.location}</p>
          <p class="font-bold mt-2">${data.price}</p>
        </div>
      </div>
    `;
  });
}

</script>

</body>
</html>
